<html>

<head>
    <title>Select ruleset to apply :: Testofill</title>
    <style type="text/css">
        #ruleSetList {
            width: 30em;
        }
    </style>
    <script src="popup.js" type="module"></script>
</head>

<body>
    <form>
        <label for="ruleSetList">Forms:</label>
        <select id="ruleSetList" size="5"></select>
        <hr />
        <label for="workflowList">Workflows:</label>
        <select id="workflowList" size="3"></select>
        <button id="runWorkflow" type="button">Run Workflow</button>
        <hr />
        <button id="liveTest" type="button"
            style="width: 100%; margin-top: 5px; background: #e9ecef; border: 1px solid #ccc; cursor: pointer; padding: 4px;">🧪
            Live Test / Keywords</button>
        <hr />
        <div style="margin-top: 8px;">
            <label style="cursor: pointer; font-size: 13px;">
                <input type="checkbox" id="toggleFloatingIcon" checked> Enable Floating Icon
            </label>
        </div>
        <div style="margin-top: 4px;">
            <label style="cursor: pointer; font-size: 13px;">
                <input type="checkbox" id="toggleAutorun" checked> Enable Autorun
            </label>
        </div>
    </form>
</body>

</html>
